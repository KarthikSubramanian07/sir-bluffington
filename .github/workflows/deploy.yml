name: Deploy to Cloudflare Pages

# Auto-deploys on every push to main when a WORKING CLOUDFLARE_API_TOKEN (plus
# CLOUDFLARE_ACCOUNT_ID) is configured. If the token is missing or can't
# authenticate, the job skips cleanly (green) instead of failing, since the site
# can also be shipped manually with `npm run deploy` (wrangler). Set the secrets
# to enable CI deploys: a token with Account > Cloudflare Pages > Edit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set; skipping CI deploy. Ship with 'npm run deploy'."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN failed to authenticate (HTTP $code); skipping CI deploy. Recreate it with Account > Cloudflare Pages > Edit, then re-run. Meanwhile 'npm run deploy' works locally."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.creds.outputs.ok == 'true'

      - run: npm run build
        if: steps.creds.outputs.ok == 'true'

      - name: Publish to Cloudflare Pages
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sirbluffington --branch=main
