name: Deploy to Cloudflare Pages

# Deploys on every push to main once CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets are set.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      HAS_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_CREDENTIALS == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_CREDENTIALS == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: env.HAS_CREDENTIALS == 'true'

      - run: npm run build
        if: env.HAS_CREDENTIALS == 'true'

      - name: Publish to Cloudflare Pages
        if: env.HAS_CREDENTIALS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sirbluffington --branch=main

      - name: Note when skipped
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "Cloudflare secrets not set; skipping deploy."
